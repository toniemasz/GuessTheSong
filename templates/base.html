{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Quiz{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'quiz/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}">Music Quiz</a>
        <nav class="topnav">
            <a href="{% url 'home' %}">Tryby gry</a>
            {% if user.is_authenticated %}
                <a href="{% url 'ranking' %}">Ranking</a>
                <a href="{% url 'create_game_mode' %}">Nowy tryb</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <div class="messages" role="status">
            {% for message in messages %}
                <div class="message message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
