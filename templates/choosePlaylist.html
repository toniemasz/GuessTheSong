<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybierz playlistę</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        .playlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .playlist-card { background: #181818; padding: 15px; border-radius: 10px; transition: 0.3s; }
        .playlist-card:hover { background: #282828; }
        .playlist-card img { width: 100%; border-radius: 5px; }
        .btn { background: #1DB954; color: white; border: none; padding: 10px; border-radius: 20px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Cześć, {{ user_name }}! 👋</h1>
    <p>Wybierz playlistę, z której będziemy losować hity:</p>

    <div class="playlist-grid">
        {% for playlist in playlists %}
            <div class="playlist-card">
                {% if playlist.images %}
                    <img src="{{ playlist.images.0.url }}" alt="{{ playlist.name }}">
                {% else %}
                    <div style="width:100%; height:150px; background:#333;">Brak okładki</div>
                {% endif %}
                <h3>{{ playlist.name }}</h3>
                <p>{{ playlist.tracks.total }} utworów</p>

                <form method="POST" action="{% url 'view_playlist' %}">
                    {% csrf_token %}
                    <input type="hidden" name="playlist_id" value="{{ playlist.id }}">
                    <button type="submit" class="btn">Zobacz Playliste</button>
                </form>

                <form method="POST" action="{% url 'start_game' %}">
                    {% csrf_token %}
                    <input type="hidden" name="playlist_id" value="{{ playlist.id }}">
                    <button type="submit" class="btn">Graj</button>
                </form>
            </div>
        {% endfor %}
    </div>
</body>
</html>
